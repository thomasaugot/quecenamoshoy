name: Deploy

# Production only after CI is green on main (12-TESTING_CI → Deploys wait for CI). Vercel's own
# deploy-on-push is OFF (vercel.json → git.deploymentEnabled false): this is the only way live.
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:

concurrency: { group: production, cancel-in-progress: false }

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      # Built ON Vercel: the VITE_* values are "Sensitive" variables, which `vercel pull` cannot
      # download (it gets "[SENSITIVE]"), so a prebuilt local build would ship a broken URL.
      - run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
