name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholder, LOCAL-shaped values: CI never talks to the real project (12-TESTING_CI)
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build --mode test && node scripts/write-headers.ts
      - run: npm run size

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # LOCAL stack inside the runner — migrations + RLS tests, never the cloud project
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
